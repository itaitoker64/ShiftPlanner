name: Play bundle

# Builds the signed Android App Bundle that gets uploaded to the Google Play Console.
#
# Deliberately manual. A Play upload burns a versionCode that can never be reused, and every
# build here is a candidate for something users install, so it should not happen on every push
# the way the pre-release APK in release.yml does.
#
# Needs four repository secrets, all from the *upload* key — a different key from the
# SIGNING_* one release.yml uses for pre-release APKs. See docs/play-release.md:
#   PLAY_UPLOAD_KEYSTORE_BASE64  base64 of the upload keystore
#   PLAY_UPLOAD_KEYSTORE_PASSWORD
#   PLAY_UPLOAD_KEY_ALIAS
#   PLAY_UPLOAD_KEY_PASSWORD
#
# And two repository variables (Settings -> Secrets and variables -> Actions -> Variables).
# These are not secrets: both ids ship inside the bundle and are readable by anyone who
# unzips it. They are configuration, kept out of the tree so a debug build can never see them.
#   ADMOB_APP_ID           ca-app-pub-…~…
#   ADMOB_BANNER_UNIT_ID   ca-app-pub-…/…
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: >-
          versionCode for this bundle. Must be higher than every versionCode already uploaded
          to Play, including ones that were rolled back. Play rejects a repeat.
        required: true
        type: string
      ad_ids:
        description: >-
          live = the real AdMob ids, required for anything users can install.
          test = Google's sample ids, for an internal-testing build made before AdMob is set up.
          A test build must never be promoted past internal testing: it earns nothing.
        required: true
        default: live
        type: choice
        options: [live, test]

concurrency:
  group: play
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Java 21: Robolectric will not build a sandbox for SDK 36 on 17. See android.yml.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Checked before anything is built, so a misconfigured repository fails in seconds rather
      # than after a five-minute R8 run that produces a bundle nobody can upload.
      - name: Check release configuration is present
        env:
          KEYSTORE: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          ADMOB_BANNER_UNIT_ID: ${{ vars.ADMOB_BANNER_UNIT_ID }}
        run: |
          fail=0
          if [ -z "$KEYSTORE" ]; then
            echo "::error::PLAY_UPLOAD_KEYSTORE_BASE64 is not set. Play rejects an unsigned"
            echo "::error::bundle, and every upload after the first must use the same key."
            fail=1
          fi
          if [ "${{ inputs.ad_ids }}" = "live" ] \
             && { [ -z "$ADMOB_APP_ID" ] || [ -z "$ADMOB_BANNER_UNIT_ID" ]; }; then
            echo "::error::ADMOB_APP_ID / ADMOB_BANNER_UNIT_ID repository variables are not set."
            echo "::error::Without them the build would carry Google's sample ids and earn nothing."
            echo "::error::To build for internal testing before AdMob exists, re-run with ad_ids=test."
            fail=1
          fi
          exit $fail

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      # Windows is the usual source of trouble here. certutil -encode wraps its output at 64
      # characters and wraps it in PEM header lines; a paste that has been through Notepad
      # carries CRLFs. Plain `base64 -d` rejects all of that with "invalid input" and says
      # nothing about which it was, so strip the known noise first and name what is left.
      - name: Decode upload keystore
        env:
          KEYSTORE: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          STOREPASS: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE" \
            | grep -v -- '-----' \
            | tr -d '[:space:]' \
            | base64 -d > "$RUNNER_TEMP/upload.jks" 2>/dev/null || true

          if [ ! -s "$RUNNER_TEMP/upload.jks" ]; then
            echo "::error::PLAY_UPLOAD_KEYSTORE_BASE64 did not decode to anything."
            echo "::error::On Windows, generate it with PowerShell rather than certutil:"
            echo "::error::  [Convert]::ToBase64String([IO.File]::ReadAllBytes(\"\$env:USERPROFILE\\shiftly-upload.jks\")) | Set-Clipboard"
            exit 1
          fi

          # Decoding to *something* is not the same as decoding to the keystore. Checking the
          # alias and password here turns three different mistakes into three different
          # messages, rather than one confusing Gradle failure five minutes from now.
          if ! keytool -list -keystore "$RUNNER_TEMP/upload.jks" \
                 -storepass "$STOREPASS" -alias "$ALIAS" > /dev/null 2>&1; then
            echo "::error::The decoded file is not a keystore, or the password or alias is wrong."
            echo "::error::PLAY_UPLOAD_KEY_ALIAS must match the -alias you passed to keytool."
            echo "::error::Check it locally with:"
            echo "::error::  keytool -list -keystore shiftly-upload.jks"
            exit 1
          fi

      - name: Build signed bundle
        env:
          SHIFTLY_VERSION_CODE: ${{ inputs.version_code }}
          SHIFTLY_UPLOAD_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          SHIFTLY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          SHIFTLY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          SHIFTLY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
          SHIFTLY_ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          SHIFTLY_ADMOB_BANNER_UNIT_ID: ${{ vars.ADMOB_BANNER_UNIT_ID }}
        run: |
          if [ "${{ inputs.ad_ids }}" = "test" ]; then
            ./gradlew :app:bundleRelease -PshiftlyUseTestAds=true
          else
            ./gradlew :app:bundleRelease
          fi

      # A bundle that was silently left unsigned looks identical until Play rejects it, by which
      # point the versionCode is spent. jarsigner is what Play itself checks.
      - name: Verify the bundle is signed
        run: |
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab \
            | grep -q "jar verified" || {
              echo "::error::The bundle is not signed. Check the PLAY_UPLOAD_* secrets."
              exit 1
            }

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      # The artifact name is the only thing anyone reads before dragging a file into Play, so a
      # test-ads build has to say so there rather than in a log nobody opens.
      - name: Name the build
        id: name
        run: |
          if [ "${{ inputs.ad_ids }}" = "test" ]; then
            echo "suffix=-TEST-ADS-DO-NOT-PROMOTE" >> "$GITHUB_OUTPUT"
            {
              echo "### ⚠️ Built with Google's TEST ad ids"
              echo ""
              echo "Fine for internal testing. This build earns nothing and must never be"
              echo "promoted to closed testing or production. Re-run with \`ad_ids=live\`"
              echo "once the AdMob ids are set."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "suffix=" >> "$GITHUB_OUTPUT"
          fi

      # Held as an artifact rather than pushed to Play: the first upload of any app has to be
      # made by hand in the Play Console anyway, and it is the point where the release notes,
      # store listing and Data Safety form are filled in.
      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: shiftly-play-${{ inputs.version_code }}${{ steps.name.outputs.suffix }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # Play's crash reports come back symbolicated only if it has the mapping file. Upload it
      # in the Play Console alongside the bundle, or stack traces from the field are unreadable.
      - name: Upload the R8 mapping file
        uses: actions/upload-artifact@v4
        with:
          name: shiftly-play-${{ inputs.version_code }}${{ steps.name.outputs.suffix }}-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
