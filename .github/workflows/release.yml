name: Publish build

# Publishes an installable APK to a GitHub Release on every push to main, so a phone can pick up
# changes without anyone rebuilding anything. Workflow-run artifacts are not enough for that: they
# require a logged-in browser and expire, so an updater app cannot reach them.
#
# Needs four repository secrets. Without them the job stops with an explanation rather than
# publishing something nobody can install:
#   SIGNING_KEYSTORE_BASE64  base64 of the keystore file
#   SIGNING_KEYSTORE_PASSWORD
#   SIGNING_KEY_ALIAS
#   SIGNING_KEY_PASSWORD
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Java 21: Robolectric will not build a sandbox for SDK 36 on 17. See android.yml.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check signing secrets are present
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 is not set. Every runner generates its own"
            echo "::error::throwaway debug key, so unsigned-by-a-stable-key builds cannot update"
            echo "::error::an existing install. See 'Updates on your phone' in the README."
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Decode signing keystore
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/distribution.jks"

      # run_number only ever increases, which is exactly what versionCode has to do.
      - name: Assemble signed APK
        env:
          SHIFTLY_VERSION_CODE: ${{ github.run_number }}
          SHIFTLY_KEYSTORE_FILE: ${{ runner.temp }}/distribution.jks
          SHIFTLY_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SHIFTLY_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SHIFTLY_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/distribution.jks"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk shiftly-${{ github.run_number }}.apk
          gh release create "v1.0.${{ github.run_number }}" \
            shiftly-${{ github.run_number }}.apk \
            --title "Build ${{ github.run_number }}" \
            --notes "$(git log -1 --pretty=%s)

          Installs over the previous build. Not a Play release — see the README."
